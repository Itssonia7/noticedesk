server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: noticedesk-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/noticedesk_dev}
    username: ${DB_USERNAME:noticedesk_app}
    password: ${DB_PASSWORD:noticedesk_app}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: noticedesk-pool
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${FLYWAY_USER:noticedesk}
    password: ${FLYWAY_PASSWORD:noticedesk}
    out-of-order: false
  mail:
    host: ${noticedesk.email.smtp.host:localhost}
    port: ${noticedesk.email.smtp.port:587}
    username: ${noticedesk.email.smtp.username:}
    password: ${noticedesk.email.smtp.password:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${noticedesk.email.smtp.use-tls:true}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.noticedesk: ${noticedesk.log-level:INFO}
    org.springframework.security: WARN
    org.flywaydb: INFO

noticedesk:
  environment: ${ENVIRONMENT:development}
  log-level: ${LOG_LEVEL:INFO}
  sentry-dsn: ${SENTRY_DSN:}
  allowed-origins:
    - ${ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    provider: ${AUTH_PROVIDER:dev}
    clerk-jwks-url: ${CLERK_JWKS_URL:}
    clerk-issuer: ${CLERK_ISSUER:}
  llm:
    provider-primary: ${LLM_PROVIDER_PRIMARY:stub}
    provider-secondary: ${LLM_PROVIDER_SECONDARY:}
    model-drafting: ${LLM_MODEL_DRAFTING:}
    model-triage: ${LLM_MODEL_TRIAGE:claude-sonnet-4-6}
    model-parsing: ${LLM_MODEL_PARSING:claude-sonnet-4-6}
    stub-default-canned: ${STUB_DEFAULT_CANNED:acme_mh_asmt10}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-opus-4-7}
      timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:180.0}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:180.0}
      base-url: ${OPENAI_BASE_URL:}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:180.0}
  ocr:
    provider-primary: ${OCR_PROVIDER_PRIMARY:stub}
    provider-fallback: ${OCR_PROVIDER_FALLBACK:}
    google-doc-ai:
      project-id: ${GOOGLE_DOC_AI_PROJECT_ID:}
      location: ${GOOGLE_DOC_AI_LOCATION:}
      processor-id: ${GOOGLE_DOC_AI_PROCESSOR_ID:}
    azure-doc-intel:
      endpoint: ${AZURE_DOC_INTEL_ENDPOINT:}
      api-key: ${AZURE_DOC_INTEL_API_KEY:}
  storage:
    backend: ${STORAGE_BACKEND:local}
    aws-region: ${AWS_REGION:ap-south-1}
    s3-bucket: ${S3_DOCUMENTS_BUCKET:}
    local-dir: ${LOCAL_STORAGE_DIR:/tmp/noticedesk-storage}
    max-upload-bytes: ${MAX_UPLOAD_BYTES:52428800}
  email:
    provider: ${EMAIL_PROVIDER:stub}
    from-address: ${EMAIL_FROM_ADDRESS:noreply@noticedesk.in}
    from-name: ${EMAIL_FROM_NAME:NoticeDesk}
    stub-dir: ${EMAIL_STUB_DIR:/tmp/noticedesk-emails}
    inbound-webhook-secret: ${EMAIL_INBOUND_WEBHOOK_SECRET:}
    inbound-domain: ${EMAIL_INBOUND_DOMAIN:noticedesk.in}
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      use-tls: ${SMTP_USE_TLS:true}
  workflow:
    backend: ${WORKFLOW_BACKEND:inline}
    temporal-host: ${TEMPORAL_HOST:localhost:7233}
    temporal-namespace: ${TEMPORAL_NAMESPACE:default}
    temporal-task-queue: ${TEMPORAL_TASK_QUEUE:noticedesk-ocr}
  document-parsing:
    prompt-version: ${DOCUMENT_PARSING_PROMPT_VERSION:v1}
    max-tokens: ${DOCUMENT_PARSING_MAX_TOKENS:4096}
    temperature: ${DOCUMENT_PARSING_TEMPERATURE:0.0}
    citation-provider: ${CITATION_PROVIDER:stub}
    indiankanoon-api-token: ${INDIANKANOON_API_TOKEN:}
  drafting:
    ocr-excerpt-chars: ${DRAFTING_OCR_EXCERPT_CHARS:20000}
    max-output-tokens: ${DRAFTING_MAX_OUTPUT_TOKENS:16000}
    supporting-doc-excerpt-chars: ${DRAFTING_SUPPORTING_DOC_EXCERPT_CHARS:5000}
    supporting-evidence-max-chars: ${DRAFTING_SUPPORTING_EVIDENCE_MAX_CHARS:40000}
    demo-firm-name-override: ${DEMO_FIRM_NAME_OVERRIDE:}
    gst-corpus-dir: ${GST_CORPUS_DIR:../NoticeDesk_GST_Corpus_1300_Paired/NoticeDesk_GST_Corpus_1-300_Paired}

