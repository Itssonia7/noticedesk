server:
  port: ${SERVER_PORT:9090}

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: noticedesk-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/noticedesk_dev}
    username: ${DB_USERNAME:noticedesk_app}
    password: ${DB_PASSWORD:noticedesk_app}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: noticedesk-pool
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${FLYWAY_USER:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}
    out-of-order: false
  mail:
    host: ${noticedesk.email.smtp.host:localhost}
    port: ${noticedesk.email.smtp.port:587}
    username: ${noticedesk.email.smtp.username:}
    password: ${noticedesk.email.smtp.password:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${noticedesk.email.smtp.use-tls:true}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.noticedesk: ${noticedesk.log-level:INFO}
    org.springframework.security: WARN
    org.flywaydb: INFO

noticedesk:
  private-seed-dir: ${PRIVATE_SEED_DIR:}
  environment: ${ENVIRONMENT:development}
  log-level: ${LOG_LEVEL:INFO}
  sentry-dsn: ${SENTRY_DSN:}
  allowed-origins:
    - ${ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    provider: ${AUTH_PROVIDER:dev}
    clerk-jwks-url: ${CLERK_JWKS_URL:}
    clerk-issuer: ${CLERK_ISSUER:}
  llm:
    provider-primary: ${LLM_PROVIDER_PRIMARY:stub}
    provider-secondary: ${LLM_PROVIDER_SECONDARY:}
    # Provider of the new-issue / high-stakes writers (anthropic | gemini); empty = provider-primary. With gemini the
    # model is LLM_MODEL_NEW_ISSUE / LLM_MODEL_HIGH_STAKES (empty = GEMINI_MODEL) and the key GEMINI_API_KEY.
    provider-new-issue: ${LLM_PROVIDER_NEW_ISSUE:}
    provider-high-stakes: ${LLM_PROVIDER_HIGH_STAKES:}
    model-extraction: ${LLM_MODEL_EXTRACTION:claude-haiku-4-5-20251001}
    model-formatting: ${LLM_MODEL_FORMATTING:claude-haiku-4-5-20251001}
    model-opus: ${LLM_MODEL_OPUS:claude-opus-4-7}
    model-drafting: ${LLM_MODEL_DRAFTING:claude-haiku-4-5-20251001}
    model-triage: ${LLM_MODEL_TRIAGE:claude-haiku-4-5-20251001}
    model-parsing: ${LLM_MODEL_PARSING:claude-haiku-4-5-20251001}
    model-matching: ${LLM_MODEL_MATCHING:}
    model-partial-drafting: ${LLM_MODEL_PARTIAL_DRAFTING:}
    model-new-issue: ${LLM_MODEL_NEW_ISSUE:}
    model-high-stakes: ${LLM_MODEL_HIGH_STAKES:}
    # Shortlist title pass (ShortlistTitleAgent); empty = the matching model
    model-shortlist: ${LLM_MODEL_SHORTLIST:}
    # Thinking effort (output_config.effort: low|medium|high|xhigh|max), sent only to the models in
    # anthropic.effort-models. An empty value sends no effort (the model's own default applies).
    effort-matching: ${LLM_EFFORT_MATCHING:medium}
    effort-partial-drafting: ${LLM_EFFORT_PARTIAL_DRAFTING:medium}
    effort-new-issue: ${LLM_EFFORT_NEW_ISSUE:medium}
    effort-high-stakes: ${LLM_EFFORT_HIGH_STAKES:medium}
    # Template variable extraction (TemplateVariableAgent, one call per notice after matching, on the
    # partial-drafting model): copies the values of card-specific template variables out of the notice text.
    effort-template-variables: ${LLM_EFFORT_TEMPLATE_VARIABLES:low}
    effort-shortlist: ${LLM_EFFORT_SHORTLIST:low}
    # max_tokens per agent. Thinking tokens count against it, so it must leave room for thinking + JSON.
    # A max_tokens stop is treated as a failure and retried once with the *-retry cap.
    max-tokens-matching: ${LLM_MAX_TOKENS_MATCHING:12000}
    max-tokens-matching-retry: ${LLM_MAX_TOKENS_MATCHING_RETRY:20000}
    max-tokens-partial-drafting: ${LLM_MAX_TOKENS_PARTIAL_DRAFTING:16000}
    max-tokens-partial-drafting-retry: ${LLM_MAX_TOKENS_PARTIAL_DRAFTING_RETRY:24000}
    max-tokens-new-issue: ${LLM_MAX_TOKENS_NEW_ISSUE:16000}
    max-tokens-new-issue-retry: ${LLM_MAX_TOKENS_NEW_ISSUE_RETRY:24000}
    max-tokens-high-stakes: ${LLM_MAX_TOKENS_HIGH_STAKES:16000}
    max-tokens-high-stakes-retry: ${LLM_MAX_TOKENS_HIGH_STAKES_RETRY:24000}
    max-tokens-template-variables: ${LLM_MAX_TOKENS_TEMPLATE_VARIABLES:2000}
    max-tokens-template-variables-retry: ${LLM_MAX_TOKENS_TEMPLATE_VARIABLES_RETRY:4000}
    # (the shortlist title pass: matching.shortlist.title-max-tokens / title-retry-max-tokens)
    # Per-notice cost control. Once either limit is reached, the remaining AI issues get a
    # [[PARTNER: ...]] placeholder and a block flag instead of another model call.
    max-cost-inr-per-notice: ${LLM_MAX_COST_INR_PER_NOTICE:60}
    high-stakes:
      max-calls-per-notice: ${LLM_HIGH_STAKES_MAX_CALLS_PER_NOTICE:6}
    # Logs a 400-char sample of an unparseable writer response (it can quote the notice): test bench only.
    debug-log-raw-output: ${LLM_DEBUG_LOG_RAW_OUTPUT:false}
    stub-default-canned: ${STUB_DEFAULT_CANNED:acme_mh_asmt10}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      workspace-id: ${ANTHROPIC_WORKSPACE_ID:}
      model: ${ANTHROPIC_MODEL:claude-opus-4-7}
      timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:600.0}
      # Models that always think: they get output_config.effort and never thinking/temperature/top_p/top_k.
      effort-models: ${ANTHROPIC_EFFORT_MODELS:claude-sonnet-5-5,claude-opus-5-5}
      # Upper bound on any max_tokens sent to Anthropic.
      max-tokens-ceiling: ${ANTHROPIC_MAX_TOKENS_CEILING:32000}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:180.0}
      base-url: ${OPENAI_BASE_URL:}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:180.0}
  matching:
    allow-draft-cards: ${ALLOW_DRAFT_CARDS:false}
    shortlist:
      # true: the matching prompt carries only the cards a shortlist keeps for the notice (stage pool, rarity-
      # weighted label scoring, AI title pass; an issue matched to no card goes to the new-issue writer)
      enabled: ${MATCHING_SHORTLIST:true}
      # keep every card scoring at least this fraction of the best label score in the stage pool
      relative-cutoff: ${MATCHING_SHORTLIST_RELATIVE_CUTOFF:0.35}
      # fewer kept than this: the top cards by label score up to this many
      min-cards: ${MATCHING_SHORTLIST_MIN_CARDS:15}
      # AI title pass over the one-line card titles; a failed call degrades to labels only
      ai-titles: ${MATCHING_SHORTLIST_AI:true}
      # stricter label cut-off when the AI title pass returned at least one card (the values above apply when the
      # pass is off, failed, or returned no card)
      relative-cutoff-with-ai: ${MATCHING_SHORTLIST_RELATIVE_CUTOFF_WITH_AI:0.5}
      min-cards-with-ai: ${MATCHING_SHORTLIST_MIN_CARDS_WITH_AI:12}
      # a show cause notice / intimation that cites no section or rule: every card whose title contains one of these
      # (case-insensitive) is added in full (no label can point at a "missing provision" card)
      absence-title-patterns: ${MATCHING_SHORTLIST_ABSENCE_TITLE_PATTERNS:no section,vague}
      # max_tokens of the AI title pass and of its one retry after a max_tokens stop; thinking tokens count against
      # it (measured: 1,500 truncated 11 of 14 notices, 3,000 still truncated one)
      title-max-tokens: ${MATCHING_SHORTLIST_TITLE_MAX_TOKENS:6000}
      title-retry-max-tokens: ${MATCHING_SHORTLIST_TITLE_RETRY_MAX_TOKENS:9000}
      # true: the shortlisted card ids (full, titles-only, defect-check cards; ids only) are logged at INFO, else DEBUG
      log-ids: ${MATCHING_SHORTLIST_LOG_IDS:false}
  catalogue:
    # Provisional content = 'draft' issue cards promoted from an approved AI issue section (card ids
    # NDK-AI-nnn or a new draft version of an existing card) and their 'provisional' reply templates.
    # true (default): matching sees them, so a promoted template is reused on the next similar notice,
    # with the info flag FLAG_PROVISIONAL_TEMPLATE in the partner note. false: CA-approved cards only.
    include-provisional: ${CATALOGUE_INCLUDE_PROVISIONAL:true}
    # Learned library ($PRIVATE_SEED_DIR/learned, separate from the catalogue): issues the new-issue writer drafted with
    # no catalogue card. true: APPROVED entries are shown to the matcher as extra LRN-... cards and reused as templates;
    # provisional entries never are. false (default): the matcher sees the catalogue only.
    include-learned: ${CATALOGUE_INCLUDE_LEARNED:false}
    # source_run of new learned entries (e.g. the deployed commit); blank = "unknown"
    learned-source-run: ${NOTICEDESK_SOURCE_RUN:}
  pricing:
    inr-per-usd: 88.0
    models:
      # output-per-million applies to all output tokens, thinking included.
      # cache-write = 5-minute ephemeral cache write = 1.25x input.
      "claude-sonnet-5-5":
        input-per-million: 2.00
        output-per-million: 10.00
        cache-read-per-million: 0.20
        cache-write-per-million: 2.50
      "claude-3-5-sonnet-20241022":
        input-per-million: 3.0
        output-per-million: 15.0
        cache-read-per-million: 0.30
        cache-write-per-million: 3.75
      "claude-3-5-haiku-20241022":
        input-per-million: 0.80
        output-per-million: 4.00
        cache-read-per-million: 0.08
        cache-write-per-million: 1.00
      "claude-haiku-4-5-20251001":
        input-per-million: 0.80
        output-per-million: 4.00
        cache-read-per-million: 0.08
        cache-write-per-million: 1.00
      "claude-opus-4-7":
        input-per-million: 15.0
        output-per-million: 75.0
        cache-read-per-million: 1.50
        cache-write-per-million: 18.75
      "claude-opus-5-5":
        input-per-million: 4.00
        output-per-million: 20.00
        cache-read-per-million: 0.20
        cache-write-per-million: 5.00
      # list prices for prompts up to 100K tokens (above that 0.50 / 2.50); every prompt this app sends on it is far below 100K.
      "claude-haiku-5-5":
        input-per-million: 0.10
        output-per-million: 0.50
        cache-read-per-million: 0.01
        cache-write-per-million: 0.125
      # free tier: replace with paid rates if the key is moved to a paid project. The key is in brackets because it
      # contains a dot (without them the binder reads "3" / "6-flash" as nested keys and the price is lost).
      "[gemini-3.6-flash]":
        input-per-million: 0.0
        output-per-million: 0.0
        cache-read-per-million: 0.0
        cache-write-per-million: 0.0
      "claude-3-opus-20240229":
        input-per-million: 15.0
        output-per-million: 75.0
        cache-read-per-million: 1.50
        cache-write-per-million: 18.75
  ocr:
    provider-primary: ${OCR_PROVIDER_PRIMARY:stub}
    provider-fallback: ${OCR_PROVIDER_FALLBACK:}
    # OCR_PROVIDER_PRIMARY=gemini: the PDF / image is sent inline to this model (GEMINI_API_KEY). The default model is
    # the GEMINI_MODEL default, priced under noticedesk.pricing.models.
    gemini:
      model: ${OCR_GEMINI_MODEL:${GEMINI_MODEL:gemini-3.6-flash}}
      max-output-tokens: ${OCR_GEMINI_MAX_OUTPUT_TOKENS:65536}
      timeout-seconds: ${OCR_GEMINI_TIMEOUT_SECONDS:300.0}
    google-doc-ai:
      project-id: ${GOOGLE_DOC_AI_PROJECT_ID:}
      location: ${GOOGLE_DOC_AI_LOCATION:}
      processor-id: ${GOOGLE_DOC_AI_PROCESSOR_ID:}
    azure-doc-intel:
      endpoint: ${AZURE_DOC_INTEL_ENDPOINT:}
      api-key: ${AZURE_DOC_INTEL_API_KEY:}
  storage:
    backend: ${STORAGE_BACKEND:local}
    aws-region: ${AWS_REGION:ap-south-1}
    s3-bucket: ${S3_DOCUMENTS_BUCKET:}
    local-dir: ${LOCAL_STORAGE_DIR:/tmp/noticedesk-storage}
    max-upload-bytes: ${MAX_UPLOAD_BYTES:52428800}
  email:
    provider: ${EMAIL_PROVIDER:stub}
    from-address: ${EMAIL_FROM_ADDRESS:noreply@noticedesk.in}
    from-name: ${EMAIL_FROM_NAME:NoticeDesk}
    stub-dir: ${EMAIL_STUB_DIR:/tmp/noticedesk-emails}
    inbound-webhook-secret: ${EMAIL_INBOUND_WEBHOOK_SECRET:}
    inbound-domain: ${EMAIL_INBOUND_DOMAIN:noticedesk.in}
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      use-tls: ${SMTP_USE_TLS:true}
  workflow:
    backend: ${WORKFLOW_BACKEND:inline}
    temporal-host: ${TEMPORAL_HOST:localhost:7233}
    temporal-namespace: ${TEMPORAL_NAMESPACE:default}
    temporal-task-queue: ${TEMPORAL_TASK_QUEUE:noticedesk-ocr}
  document-parsing:
    prompt-version: ${DOCUMENT_PARSING_PROMPT_VERSION:v1}
    max-tokens: ${DOCUMENT_PARSING_MAX_TOKENS:4096}
    temperature: ${DOCUMENT_PARSING_TEMPERATURE:0.0}
    citation-provider: ${CITATION_PROVIDER:stub}
    indiankanoon-api-token: ${INDIANKANOON_API_TOKEN:}
  drafting:
    pipeline: ${DRAFTING_PIPELINE:rag}
    ocr-excerpt-chars: ${DRAFTING_OCR_EXCERPT_CHARS:20000}
    max-output-tokens: ${DRAFTING_MAX_OUTPUT_TOKENS:16000}
    supporting-doc-excerpt-chars: ${DRAFTING_SUPPORTING_DOC_EXCERPT_CHARS:5000}
    supporting-evidence-max-chars: ${DRAFTING_SUPPORTING_EVIDENCE_MAX_CHARS:40000}
    demo-firm-name-override: ${DEMO_FIRM_NAME_OVERRIDE:}
    gst-corpus-dir: ${GST_CORPUS_DIR:../NoticeDesk_GST_Corpus_1300_Paired/NoticeDesk_GST_Corpus_1-300_Paired}
    # High-stakes drafting mode is OFF by default: every notice goes through the normal path
    # (code template fill / partial writer / new-issue writer). Switch it on per trigger by env var.
    high-stakes:
      section-74: ${HIGH_STAKES_SECTION_74:false}
      appeal-stage: ${HIGH_STAKES_APPEAL_STAGE:false}
      demand-threshold: ${HIGH_STAKES_DEMAND_THRESHOLD:}
    # Code defect checks after matching: a DRC-01A giving fewer days than this to reply is a defect (firm to confirm)
    defects:
      drc01a-min-days: ${DEFECT_DRC01A_MIN_DAYS:15}
  citation:
    provider: ${CITATION_PROVIDER:stub}
    indiankanoon-api-token: ${INDIANKANOON_API_TOKEN:}
    cache-ttl-days: ${CITATION_CACHE_TTL_DAYS:30}
    max-calls-per-draft: ${IK_MAX_CALLS_PER_DRAFT:15}
    indiankanoon:
      # Real INR price of one IndianKanoon search / document-fragment call: set from your IndianKanoon
      # plan. Logged per call (api_usage_logs, step ik_search / ik_fragment) and counted against the
      # per-notice cost cap. 0 = calls are logged but cost nothing.
      cost-inr-per-search: ${INDIANKANOON_COST_INR_PER_SEARCH:0}
      cost-inr-per-fragment: ${INDIANKANOON_COST_INR_PER_FRAGMENT:0}
  embedding:
    provider: ${EMBEDDING_PROVIDER:stub}
    model: ${EMBEDDING_MODEL:gemini-embedding-001}
    similarity-threshold: ${EMBEDDING_SIMILARITY_THRESHOLD:0.70}
    output-dimensionality: ${EMBEDDING_OUTPUT_DIMENSIONALITY:1536}


